name: Calidad

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Formato, lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar formato
        run: npm run format:check

      - name: Revisar lint
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm test -- --watch=false

      - name: Compilar para producción
        run: npm run build

  backend:
    name: API en SQLite aislada
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Flask_Llamma_API
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Flask_Llamma_API/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar sintaxis
        run: |
          python -m compileall -q app.py auth.py config.py estados.py extensions.py ratelimit.py seed.py utils.py models routes migrations tests

      - name: Ejecutar pruebas de flujo
        run: python -m unittest discover -s tests -v
