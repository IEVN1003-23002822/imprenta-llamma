@if (confirmacion.actual(); as opciones) {
  <div
    class="modal fade show d-block"
    tabindex="-1"
    appModalAccesible
    (cerrar)="confirmacion.responder(false)"
    style="z-index: 1065"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <span class="panel-kicker">Confirmación</span>
            <h2 class="modal-title h5 mb-0">{{ opciones.titulo }}</h2>
          </div>
          <button
            class="btn btn-icon"
            type="button"
            aria-label="Cerrar"
            (click)="confirmacion.responder(false)"
          >
            <i class="bi bi-x-lg"></i>
          </button>
        </div>

        <div class="modal-body">
          <p class="mb-0">{{ opciones.mensaje }}</p>
        </div>

        <div class="modal-footer">
          <button class="btn btn-soft" type="button" (click)="confirmacion.responder(false)">
            {{ opciones.cancelar || 'Cancelar' }}
          </button>
          <button
            class="btn"
            type="button"
            [class.btn-danger]="opciones.peligro"
            [class.btn-brand]="!opciones.peligro"
            (click)="confirmacion.responder(true)"
          >
            {{ opciones.confirmar || 'Confirmar' }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
